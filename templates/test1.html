<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T1-204A LAB Gesture Recognition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI for enhanced components and color schemes -->
    <script src="https://cdn.jsdelivr.net/npm/daisyui@2.51.5/dist/full.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- 添加 Bootstrap 4.5.0 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        .success-message {
            font-size: 1.5rem;
            color: #000000;
            font-weight: bold;
            background-color: #4ade80;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            text-align: center;
        }
        .delete-button {
            background-color: #ff4d4d;
            color: white;
            font-weight: bold;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-message {
            font-size: 1.5rem;
            color: #000000;
            font-weight: bold;
            background-color: #ff4d4d;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            text-align: center;
        }

    </style>
</head>
<body class="bg-base-100 text-base-content">
    <div class="max-w-6xl mx-auto px-4 py-6">
        <!-- Logo Section -->
        <div class="text-center mb-6">
            <a href="/" class="inline-block">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="logo" class="logo" style="width: 400px;">
            </a>
        </div>

        <!-- Video Player -->
        <video id="videoPlayer" width="750" controls class="mx-auto mb-6">
            <source src="{{ url_for('static', filename='gesture_output.webm') }}" type="video/webm" />
            Your browser does not support the video tag.
        </video>

        <div class="container">
            <!-- Label Selection -->
            <div class="label-selection my-4"></div>

            <!-- Time Navigation -->
            <div class="time-navigation" id="timeNavigation">
                <button id="prevButton">
                    <i class="fas fa-arrow-left fa-2x mr-3"></i>
                    <span>Last Time</span>
                </button>
                <div id="currentTime" class="time-display">
                    Loading...
                </div>
                <button id="nextButton">
                    <span>Next Time</span>
                    <i class="fas fa-arrow-right fa-2x ml-3"></i>
                </button>
            </div>
            
            <!-- Gesture Buttons Container -->
            <div class="flex flex-wrap justify-center items-center my-4 w-full" id="gesturesContainer">
                <!-- Buttons will be dynamically generated by JavaScript -->
            </div>
            
            <!-- Gesture Type and Username Selection -->
            <div class="flex flex-col md:flex-row justify-center my-4 space-y-4 md:space-y-0 md:space-x-4">
                <div>
                    <label class="mr-2 text-xl font-semibold">Gesture Type:</label>
                    <select id="gestureType" class="select select-bordered w-full max-w-xs text-xl p-3">
                        <option value="default">Default</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div id="usernameContainer" class="hidden">
                    <label class="mr-2 text-xl font-semibold">User:</label>
                    <select id="usernameSelect" class="select select-bordered w-full max-w-xs text-xl p-3">
                        <!-- User options will be dynamically generated by JavaScript -->
                    </select>
                </div>
            </div>
            
            <!-- Add New Gesture -->
            <div class="flex flex-col md:flex-row justify-center my-4 w-full">
                <input type="text" id="newGestureName" placeholder="Add new gesture name" class="input input-bordered input-lg rounded-none md:rounded-l w-full md:w-auto text-xl p-3" />
                <button id="addGestureButton" class="btn btn-success btn-lg rounded-none md:rounded-r text-xl">
                    Add Gesture
                </button>
            </div>

            <!-- Save, Refresh, and Delete Buttons -->
            <div class="flex flex-col md:flex-row justify-center space-y-4 md:space-y-0 md:space-x-4 my-4">
                <button id="saveToDatabase" class="btn btn-warning btn-lg w-full md:w-32">
                    Save to Database
                </button>
                <button id="refreshButton" class="btn btn-secondary btn-lg w-full md:w-24">
                    Refresh
                </button>
                <button id="deleteData" class="delete-button">
                    <i class="fas fa-trash-alt mr-2"></i>
                    Delete Data
                </button>
            </div>

            <!-- Messages -->
            <div id="message" class="text-center my-2 hidden text-green-600 font-bold">
                Data deleted successfully!
            </div>
            <div id="infoMessage" class="text-center my-4 text-red-600 font-bold bg-base-200 p-4 rounded text-lg hidden"></div>
            <div id="successMessage" class="text-center my-4 text-green-600 font-bold bg-base-200 p-4 rounded text-lg hidden"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const videoPlayer = document.getElementById('videoPlayer');
            const currentTimeDisplay = document.getElementById('currentTime');
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const gesturesContainer = document.getElementById('gesturesContainer');
            const deleteDataButton = document.getElementById('deleteData');
            const messageDiv = document.getElementById('message');
            const refreshButton = document.getElementById('refreshButton');
            const saveToDatabaseButton = document.getElementById('saveToDatabase');
            const addGestureButton = document.getElementById('addGestureButton');
            const newGestureNameInput = document.getElementById('newGestureName');
            const gestureTypeSelect = document.getElementById('gestureType');
            const usernameContainer = document.getElementById('usernameContainer');
            const usernameSelect = document.getElementById('usernameSelect');
            const infoMessageDiv = document.getElementById('infoMessage');
            const successMessageDiv = document.getElementById('successMessage');

            let uniqueLastValues = [];
            let currentIndex = 0;
            let labelAssignments = [];
            let currentTimeIndex = 0;

            // 定义初始手势列表，包括 'Unknown' 手势
            const defaultGestures = [
                { id: 'ForwardButton', label: 0, name: 'Forward' },
                { id: 'BackwardButton', label: 1, name: 'Backward' },
                { id: 'StopButton', label: 2, name: 'Stop' },
                { id: 'FireButton', label: 3, name: 'Fire' },
                { id: 'FollowButton', label: 4, name: 'Follow' },
                { id: 'zero_oclock_direction', label: 5, name: '0 oclock direction' },
                { id: 'three_oclock_direction', label: 6, name: '3 oclock direction' },
                { id: 'six_oclock_direction', label: 7, name: '6 oclock direction' },
                { id: 'nine_oclock_direction', label: 8, name: '9 oclock direction' },
                { id: 'UnknownButton', label: 99, name: 'Unknown' } // 新增 'Unknown' 手势
            ];

            let customGestures = [];
            let gestures = [...defaultGestures]; // 初始化为默认手势

            // 动态生成手势按钮
            function renderGestures() {
                gesturesContainer.innerHTML = '';
                gestures.forEach(gesture => {
                    const button = document.createElement('button');
                    button.id = gesture.id;
                    button.className = 'gesture-button w-24 h-24 bg-yellow-300 hover:bg-yellow-400 text-purple-700 font-bold py-2 px-4 rounded m-1';
                    button.textContent = `${gesture.label}: '${gesture.name}'`;
                    button.dataset.label = gesture.label;
                    gesturesContainer.appendChild(button);
                });
            }

            // 初始化手势按钮
            renderGestures();

            // 更新手势颜色
            function updateButtonColors(labelValue) {
                gestures.forEach(gesture => {
                    const button = document.getElementById(gesture.id);
                    if (!button) return;
                    if (gesture.label === labelValue) {
                        button.style.backgroundColor = 'green';
                        button.style.color = 'white';
                    } else {
                        button.style.backgroundColor = 'yellow';
                        button.style.color = 'purple';
                    }
                });
            }

            // 根据当前标签更新按钮颜色
            function updateButtonColorsBasedOnLabel() {
                const currentLabel = labelAssignments[currentIndex];
                if (currentLabel !== undefined && !isNaN(currentLabel)) {
                    updateButtonColors(currentLabel);
                }
            }

            // 隐藏成功信息
            function hideMessage() {
                messageDiv.style.display = 'none';
                infoMessageDiv.style.display = 'none';
                successMessageDiv.style.display = 'none';
            }

            // 获取 CSV 数据
            function fetchcsv() {
                fetch('./static/gesture_inference_data.csv')
                    .then(response => response.text())
                    .then(data => {
                        Papa.parse(data, {
                            header: true, // 设置为 true，因为 CSV 包含标题
                            skipEmptyLines: true,
                            complete: function (results) {
                                const dataRows = results.data;

                                // 提取时间和标签
                                const lastValues = dataRows.map(line => parseFloat(line['time']));
                                const labelValues = dataRows.map(line => parseInt(line['label'], 10));

                                // 提取唯一的时间点，并排序
                                uniqueLastValues = Array.from(new Set(lastValues)).sort((a, b) => a - b);

                                // 映射时间点到标签
                                labelAssignments = uniqueLastValues.map(timeVal => {
                                    // 找到所有与该时间点匹配的行
                                    const rows = dataRows.filter(row => parseFloat(row['time']) === timeVal);
                                    // 获取最后一个匹配行的标签
                                    const row = rows[rows.length - 1];
                                    return row ? parseInt(row['label'], 10) : 0;
                                });

                                // 获取当前时间的索引
                                currentIndex = getClosestIndex(uniqueLastValues, parseFloat(videoPlayer.currentTime.toFixed(3)));
                                if (currentIndex === -1) {
                                    currentIndex = 0;
                                }

                                if (labelAssignments[currentIndex] === undefined || isNaN(labelAssignments[currentIndex])) {
                                    labelAssignments[currentIndex] = 0; // 默认标签
                                }
                                updateButtonColorsBasedOnLabel();
                            },
                        });
                    })
                    .catch(error => console.error('Error:', error));
            }

            // 找到最接近的时间索引
            function getClosestIndex(arr, val) {
                let closest = arr.reduce((prev, curr) => Math.abs(curr - val) < Math.abs(prev - val) ? curr : prev, arr[0]);
                return arr.indexOf(closest);
            }

            // 初始化 CSV
            fetchcsv();

            // 视频时间更新时更新显示和按钮颜色
            videoPlayer.addEventListener('timeupdate', function () {
                currentTimeDisplay.textContent = videoPlayer.currentTime.toFixed(3) + ' sec';
                currentIndex = getClosestIndex(uniqueLastValues, parseFloat(videoPlayer.currentTime.toFixed(3)));
                if (currentIndex === -1) {
                    // Time not found, set to 0 or handle accordingly
                    currentIndex = 0;
                }
                if (labelAssignments[currentIndex] === undefined || isNaN(labelAssignments[currentIndex])) {
                    labelAssignments[currentIndex] = 0; // 默认标签
                }
                updateButtonColorsBasedOnLabel();
            });

            // 前一个时间点
            prevButton.addEventListener('click', function () {
                if (currentIndex > 0) {
                    currentIndex--;
                    videoPlayer.currentTime = uniqueLastValues[currentIndex];
                    hideMessage();
                }
            });

            // 下一个时间点
            nextButton.addEventListener('click', function () {
                if (currentIndex < uniqueLastValues.length - 1) {
                    currentIndex++;
                    videoPlayer.currentTime = uniqueLastValues[currentIndex];
                    hideMessage();
                }
            });

            // 刷新 CSV
            refreshButton.addEventListener('click', function () {
                fetchcsv();
                hideMessage();
            });

            // 使用事件委派处理手势按钮点击
            gesturesContainer.addEventListener('click', function (e) {
                if (e.target && e.target.matches('button.gesture-button')) {
                    const label = parseInt(e.target.dataset.label, 10);
                    if (labelAssignments[currentIndex] !== label) {
                        updateLabel(label);
                        sendLabelToServer(label);
                        hideMessage();
                    }
                }
            });

            // 更新标签并改变按钮颜色
            function updateLabel(labelValue) {
                labelAssignments[currentIndex] = labelValue;
                updateButtonColors(labelValue);
            }

            // 发送标签到服务器
            function sendLabelToServer(labelValue) {
                let username = 'default'; // 默認為 'default'
                const gestureType = gestureTypeSelect.value;
                if (gestureType === 'custom') {
                    username = usernameSelect.value;
                }

                const dataToSend = {
                    time: uniqueLastValues[currentIndex] + ' sec', // 使用准确的时间点
                    label: labelValue
                };

                fetch('/update_csv', { // 使用相对路径以避免跨域问题
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dataToSend),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        console.log(data.message);
                        // 重新获取 CSV 数据以反映更新
                        fetchcsv();
                    } else if (data.error) {
                        console.error('Error:', data.error);
                        infoMessageDiv.textContent = 'Error: ' + data.error;
                        infoMessageDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    infoMessageDiv.textContent = 'An error occurred while updating the label.';
                    infoMessageDiv.style.display = 'block';
                });
            }

            // 删除数据
            deleteDataButton.addEventListener('click', function () {
                const gestureType = gestureTypeSelect.value;
                let username = 'default'; // 默認為 'default'
                if (gestureType === 'custom') {
                    username = usernameSelect.value;
                }

                const dataToSend = {
                    time: uniqueLastValues[currentIndex] + ' sec' // 使用准确的时间点
                };
                fetch('/delete_csv', { // 使用相对路径以避免跨域问题
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dataToSend),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        console.log(data.message);
                        messageDiv.style.display = 'block';
                        fetchcsv();
                    } else if (data.error) {
                        console.error('Error:', data.error);
                        infoMessageDiv.textContent = 'Error: ' + data.error;
                        infoMessageDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    infoMessageDiv.textContent = 'An error occurred while deleting data.';
                    infoMessageDiv.style.display = 'block';
                });
            });

            // 手势类型选择变更事件
            gestureTypeSelect.addEventListener('change', function () {
                if (gestureTypeSelect.value === 'custom') {
                    usernameContainer.classList.remove('hidden');
                    loadUsers();
                } else {
                    usernameContainer.classList.add('hidden');
                    clearGestures();
                    gestures = [...defaultGestures];
                    renderGestures();
                }
                hideMessage();
            });

            // 加载使用者列表
            function loadUsers() {
                fetch('/get_users', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                })
                .then(response => response.json())
                .then(data => {
                    if (data.users) {
                        populateUsernameDropdown(data.users);
                    } else if (data.error) {
                        console.error('Error:', data.error);
                        infoMessageDiv.textContent = 'Error: ' + data.error;
                        infoMessageDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    infoMessageDiv.textContent = 'An error occurred while fetching users.';
                    infoMessageDiv.style.display = 'block';
                });
            }

            // 填充使用者下拉選單
            function populateUsernameDropdown(users) {
                usernameSelect.innerHTML = ''; // 清空現有選項
                if (users.length === 0) {
                    // 如果沒有使���者，提供新增使用者的選項
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'No users available. Please add a user.';
                    usernameSelect.appendChild(option);
                } else {
                    // 添加現有使用者
                    users.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user;
                        option.textContent = user;
                        usernameSelect.appendChild(option);
                    });
                }

                // 添加新增使用者的選項
                const addOption = document.createElement('option');
                addOption.value = 'add_new';
                addOption.textContent = 'Add New User';
                usernameSelect.appendChild(addOption);
            }

            // 監聽使用者選擇下拉選單變更事件
            usernameSelect.addEventListener('change', function () {
                if (usernameSelect.value === 'add_new') {
                    const newUsername = prompt('Enter new username:').trim();
                    if (newUsername) {
                        addNewUser(newUsername);
                    } else {
                        infoMessageDiv.textContent = 'Username cannot be empty.';
                        infoMessageDiv.style.display = 'block';
                        loadUsers(); // 重新加載使用者列表
                    }
                } else {
                    loadGestures(usernameSelect.value);
                }
                hideMessage();
            });

            // 添加新使用者
            function addNewUser(username) {
                fetch('/add_user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 'username': username }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        successMessageDiv.textContent = `User '${username}' added successfully.`;
                        successMessageDiv.style.display = 'block';
                        loadUsers();
                    } else if (data.error) {
                        infoMessageDiv.textContent = 'Error: ' + data.error;
                        infoMessageDiv.style.display = 'block';
                        loadUsers(); // 重新加載使用者列表
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    infoMessageDiv.textContent = 'An error occurred while adding the user.';
                    infoMessageDiv.style.display = 'block';
                    loadUsers(); // 重新加載使用者列表
                });
            }

            // 加载指定使用者的手势
            function loadGestures(username) {
                if (!username) return;
                fetch(`/get_gestures/${encodeURIComponent(username)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                })
                .then(response => response.json())
                .then(data => {
                    if (data.gestures) {
                        populateGestures(data.gestures);
                    } else if (data.error) {
                        console.error('Error:', data.error);
                        infoMessageDiv.textContent = 'Error: ' + data.error;
                        infoMessageDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    infoMessageDiv.textContent = 'An error occurred while fetching gestures.';
                    infoMessageDiv.style.display = 'block';
                });
            }

            // 填充手势按钮
            function populateGestures(userGestures) {
                gestures = [...defaultGestures]; // 先恢復默認手勢
                userGestures.forEach(gesture => {
                    const newGesture = {
                        id: `customGesture_${gesture.index}`,
                        label: gesture.index,
                        name: gesture.name
                    };
                    gestures.splice(gestures.findIndex(g => g.label === 99), 0, newGesture); // 插入到 'Unknown' 前
                });
                renderGestures();
            }

            // 清空手势列表
            function clearGestures() {
                gestures = [...defaultGestures];
                renderGestures();
            }

            // 新增手势
            addGestureButton.addEventListener('click', function () {
                const newGestureName = newGestureNameInput.value.trim();
                if (newGestureName === '') {
                    infoMessageDiv.textContent = 'Please enter a gesture name';
                    infoMessageDiv.style.display = 'block';
                    return;
                }

                const gestureType = gestureTypeSelect.value;
                let newLabel;
                let newGesture;

                if (gestureType === 'default') {
                    // 默认手势不允许新增，因为它们已经存在
                    infoMessageDiv.textContent = 'Unable to modify default gestures';
                    infoMessageDiv.style.display = 'block';
                    return;
                } else if (gestureType === 'custom') {
                    // 确保用户已选择使用者
                    const username = usernameSelect.value;
                    if (!username || username === 'add_new') {
                        infoMessageDiv.textContent = 'Please select a valid user to add custom gestures';
                        infoMessageDiv.style.display = 'block';
                        return;
                    }

                    // 发送请求到后端 /add_gesture
                    fetch('/add_gesture', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name: newGestureName,
                            username: username,
                        }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.message) {
                            // newLabel = data.label;
                            newLabel = data.label; // 使用後端返回的 label
                            newGesture = {
                                id: `customGesture_${newLabel}`,
                                label: newLabel,
                                name: newGestureName
                            };

                            customGestures.push(newGesture);

                            // Insert new gesture before 'Unknown'
                            const unknownIndex = gestures.findIndex(g => g.label === 99);
                            if (unknownIndex !== -1) {
                                gestures.splice(unknownIndex, 0, newGesture);
                            } else {
                                gestures.push(newGesture); // Fallback
                            }

                            renderGestures();
                            newGestureNameInput.value = '';
                            successMessageDiv.textContent = 'Gesture added successfully';
                            successMessageDiv.style.display = 'block';
                        } else if (data.error) {
                            infoMessageDiv.textContent = 'Error: ' + data.error;
                            infoMessageDiv.style.display = 'block';
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        infoMessageDiv.textContent = 'An error occurred while adding the gesture.';
                        infoMessageDiv.style.display = 'block';
                    });
                }
            });

            // 保存到数据库
            saveToDatabaseButton.addEventListener('click', function() {
                const gestureType = gestureTypeSelect.value;
                let username = 'default'; // 默認為 'default'
                if (gestureType === 'custom') {
                    username = usernameSelect.value;
                    if (!username || username === 'add_new') {
                        infoMessageDiv.textContent = 'Please select a valid user to upload gesture data.';
                        infoMessageDiv.className = 'info-message'; // 使用新的樣式類
                        infoMessageDiv.style.display = 'block';
                        return;
                    }
                }

                // 检查是否存在标签��� 99 的数据
            

                // 检查 CSV 是否需要添加用户名
                let processUrl = '/process-csv';
                processUrl += `?username=${encodeURIComponent(username)}`;

                fetch(processUrl, {
                    method: 'GET',
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        successMessageDiv.textContent = 'File successfully processed and data saved into database';
                        successMessageDiv.className = 'success-message'; // 使用新的樣式類
                        successMessageDiv.style.display = 'block';
                    } else if (data.error) {
                        infoMessageDiv.textContent = 'Error: ' + data.error;
                        infoMessageDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    infoMessageDiv.textContent = 'An error occurred while processing the file.';
                    infoMessageDiv.className = 'info-message'; // 使用新的樣式類
                    infoMessageDiv.style.display = 'block';
                });
            });

            // 自动新增自定义手势（当切换到 Custom 模式时）
            function addCustomGesture() {
                // 手动点击 "Add Gesture" 按钮以添加自定义手势
            }
        });
    </script>
</body>
</html>
